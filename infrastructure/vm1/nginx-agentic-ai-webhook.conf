server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10M;

    # Expose GitHub Webhook receiver
    location = /webhooks/github {
        proxy_pass http://127.0.0.1:8000/webhooks/github;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Expose GitHub App Manifest install flow
    location = /install {
        proxy_pass http://127.0.0.1:8000/install;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Expose GitHub App Manifest conversion callback
    location = /api/github/app-callback {
        proxy_pass http://127.0.0.1:8000/api/github/app-callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny all other routes (internal APIs, dashboard, metrics)
    location / {
        default_type text/plain;
        return 403 "Access Denied: Only signed GitHub webhook endpoints are exposed.\n";
    }
}
