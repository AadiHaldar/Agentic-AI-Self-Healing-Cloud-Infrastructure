# AgentHeal public front door (port 80).
# Public: the signed GitHub webhook, the read-only console, and the few API calls the console needs to display and demo.
# Closed (403): everything else, including the override / dismiss / create-PR / seed endpoints, /install and the App-credential callback.
limit_req_zone $binary_remote_addr zone=agentheal_api:10m rate=20r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 10M;

    # --- signed GitHub webhook (HMAC-verified by the app) ---
    location = /webhooks/github {
        proxy_pass http://127.0.0.1:8000/webhooks/github;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- the console (static files built by Vite) ---
    location = / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8000/;
    }
    location /assets/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8000/assets/;
    }
    location = /favicon.svg {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8000/favicon.svg;
    }
    location = /icons.svg {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8000/icons.svg;
    }

    # --- read-only data the console displays ---
    location ~ ^/api/(meta|status|topology|repos|pr-reviews|service-health)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8000;
    }

    # --- interactive demo calls: plan-only analysis and the scanner (rate limited; no cluster is attached to this VM) ---
    location ~ ^/api/(evaluate|owasp/scan|topology/reset)$ {
        limit_except POST { deny all; }
        limit_req zone=agentheal_api burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        default_type text/plain;
        return 403 "Access Denied: only the console and the signed GitHub webhook are exposed.\n";
    }
}
