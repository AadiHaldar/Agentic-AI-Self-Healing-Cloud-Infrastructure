# ==============================================================================
# Chaos Mesh Experiment: Random Pod Kill on Microservices
# Simulates sudden service outages to test MTTR and self-healing recovery loops
# ==============================================================================

apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: microservice-pod-kill
  namespace: default
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: frontend
  scheduler:
    cron: "@every 2m"
  duration: "10s"
